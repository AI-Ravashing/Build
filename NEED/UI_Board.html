<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Portal Board</title>
<style>
:root{--bg:#1b1f25;--dot:#2b3139;--card:#f5f6f8;--ink:#1d2430;--mut:#5b6573;--line:#d5d9df;--ok:#1a7f4b;--okb:#dff3e7;--wk:#8a5a00;--wkb:#fff0cc;--bl:#b3261e;--blb:#fde2e0;--ns:#4d5560;--nsb:#e6e8eb;--nw:#1d4ed8;--nwb:#dbe7ff;--acc:#0f766e}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
#vp{position:fixed;inset:0;cursor:grab;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:40px 40px}
#vp.d{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0;width:3800px;height:6600px}
#lines{position:absolute;left:0;top:0;width:3800px;height:6600px;pointer-events:none;overflow:visible}
.fr{position:absolute;background:var(--card);border-radius:14px;box-shadow:0 6px 24px #0007;overflow:hidden;font-size:13px}
.fr>header{padding:10px 14px;background:#e3e7ec;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.fr>header b{font-size:16px}.fr>header span{color:var(--mut);font-size:12px}
.pad{padding:14px}.fr h3{margin:0 0 6px;font-size:15px}.fr p{margin:4px 0}
.sm{font-size:12px;color:var(--mut)}
.p{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;white-space:nowrap}
.p.ok{background:var(--okb);color:var(--ok)}.p.wk{background:var(--wkb);color:var(--wk)}.p.bl{background:var(--blb);color:var(--bl)}.p.ns{background:var(--nsb);color:var(--ns)}.p.nw{background:var(--nwb);color:var(--nw)}
.desk{background:#fff;font-size:11.5px}.desk .top{display:flex;gap:10px;align-items:center;padding:7px 12px;background:#12343b;color:#fff}
.desk .top .rl{background:#2a6b74;border-radius:8px;padding:1px 8px;font-size:11px}.grow{flex:1}.bell{background:#b3261e;border-radius:9px;padding:0 7px;font-size:11px}
.desk .mid{display:flex;min-height:340px}.nav{width:118px;background:#eef1f4;padding:8px 0;border-right:1px solid var(--line)}
.nav div{padding:7px 12px;color:#39424e}.nav div.on{background:#fff;border-left:3px solid var(--acc);font-weight:700;color:#000}
.main{flex:1;padding:10px 12px;min-width:0}.main h4{margin:0 0 8px;font-size:14px}
.kp{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.kp div{border:1px solid var(--line);border-radius:8px;padding:4px 9px;min-width:80px}
.kp b{display:block;font-size:17px}.kp small{color:var(--mut)}
table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:3px 5px;font-size:11px}
td{border-bottom:1px solid #edf0f3;padding:4px 5px;vertical-align:top}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}.box{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fafbfc}
.box b{font-size:11.5px}.btn{display:inline-block;background:var(--acc);color:#fff;border-radius:7px;padding:4px 10px;font-weight:600;font-size:11.5px}
.btn.g{background:#e6e8eb;color:#222}.btn.r{background:var(--bl)}.btn.w{background:#c27800}
.phone{width:250px;margin:12px auto;border:6px solid #20262e;border-radius:26px;background:#fff;overflow:hidden;font-size:12px}
.phone .st{background:#12343b;color:#fff;padding:7px 12px;font-size:11px;display:flex;justify-content:space-between}
.phone .hd{padding:8px 12px;border-bottom:1px solid var(--line)}.phone .hd b{font-size:14px;display:block}
.card{margin:8px;border:1px solid var(--line);border-radius:10px;padding:8px}.card .t{font-weight:700}.card .bt{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.card .btn{padding:7px 10px;font-size:12px}.tabs{display:flex;border-top:1px solid var(--line);background:#f2f4f6}.tabs div{flex:1;text-align:center;padding:7px 0;font-size:10.5px;color:#444}.tabs .on{color:var(--acc);font-weight:700}
.info{padding:12px 14px;font-size:12.5px}.info h5{margin:8px 0 2px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}.info ul{margin:0;padding-left:16px}.info li{margin:2px 0}
.ba{margin-top:10px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}.ba div{padding:6px 9px}.ba .b{background:var(--blb)}.ba .n{background:var(--okb)}
.ba b{display:block;font-size:10.5px;letter-spacing:.06em}.b b{color:var(--bl)}.n b{color:var(--ok)}
.lab{position:absolute;width:250px;background:#fffffff2;border-radius:10px;box-shadow:0 3px 12px #0009;font-size:12px;overflow:hidden;transform:translate(-50%,-50%);border:1px solid #fff}
.lab div{padding:4px 8px}.lab .b{background:var(--blb);color:#5c1a15}.lab .n{background:var(--okb);color:#0c3d24}.lab b{font-size:10px;letter-spacing:.07em;display:block}.lab .b b{color:var(--bl)}.lab .n b{color:var(--ok)}
.mx td,.mx th{text-align:center;padding:5px 4px;font-size:12px}.mx td:first-child,.mx th:first-child{text-align:left;white-space:nowrap}
.W{background:#c7ecd6;color:#0b5a31;font-weight:700}.Rr{background:#e0ecff;color:#1a3f99}.r1{background:#fff0cc;color:#7a5200}.Z{color:#b8bec7}
.chips span{display:inline-block;margin:2px 3px 2px 0;padding:2px 8px;border-radius:10px;background:#e8eef5;font-size:11.5px}
.chips .g{background:#dff3e7}.chips .u{background:#e0ecff}
.grid{display:grid;gap:10px}.stage{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;font-size:12px}.stage h4{margin:0 0 4px;font-size:13px;background:var(--acc);color:#fff;margin:-9px -9px 7px;padding:6px 9px;border-radius:10px 10px 0 0}
.arrow{font-size:28px;color:var(--acc);text-align:center;align-self:center}
#bar{position:fixed;left:12px;top:12px;z-index:9;background:#12161bee;color:#fff;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 24px);overflow:auto;width:178px;font-size:12.5px}
#bar button{all:unset;cursor:pointer;padding:5px 8px;border-radius:7px;color:#cfd6df}#bar button:hover{background:#2a323c;color:#fff}
#bar .z{display:flex;gap:4px}#bar .z button{flex:1;text-align:center;background:#2a323c}#bar hr{border:0;border-top:1px solid #333c47;width:100%}
#hint{position:fixed;right:12px;bottom:10px;color:#8b95a3;font-size:12px;z-index:9}
</style></head><body>
<div id="vp"><div id="world"><svg id="lines"></svg></div></div>
<div id="bar"><div class="z"><button data-z="1.25">+</button><button data-z="0.8">−</button><button id="fit">Fit</button></div><hr><div id="jumps"></div></div>
<div id="hint">Drag = move · wheel = zoom · left list = jump</div>
<script>
const $=s=>document.querySelector(s),W=$('#world');
const st=(k,t)=>`<span class="p ${k}">${t}</span>`,ok=t=>st('ok',t),wk=t=>st('wk',t),bl=t=>st('bl',t),ns=t=>st('ns',t),nw=t=>st('nw',t);
const tbl=(c,r)=>`<table><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table>`;
const kp=a=>`<div class="kp">${a.map(x=>`<div><b>${x[1]}</b><small>${x[0]}</small></div>`).join('')}</div>`;
const desk=o=>`<div class="desk" style="width:${o.w||640}px"><div class="top"><b>Ravashing Build</b><span class="rl">${o.role}</span><span class="grow"></span><span class="bell">${o.bell||0} new</span><span>User (fictional)</span></div><div class="mid"><div class="nav">${o.nav.map(n=>`<div class="${n==o.act?'on':''}">${n}</div>`).join('')}</div><div class="main"><h4>${o.title}</h4>${o.kpis?kp(o.kpis):''}${o.body}</div></div></div>`;
const phone=o=>`<div class="phone"><div class="st"><span>9:41</span><span>Site mode · online</span></div><div class="hd"><b>${o.title}</b><span class="sm">${o.sub}</span></div>${o.cards.map(c=>`<div class="card"><div class="t">${c.t}</div><div class="sm">${c.s}</div><div>${c.p||''}</div><div class="bt">${c.b.map(b=>`<span class="btn ${b[1]||''}">${b[0]}</span>`).join('')}</div></div>`).join('')}<div class="tabs">${o.tabs.map((t,i)=>`<div class="${i?'':'on'}">${t}</div>`).join('')}</div></div>`;
const info=o=>`<div class="info"><h5>Sees</h5><ul>${o.sees.map(x=>`<li>${x}</li>`).join('')}</ul><h5>Updates</h5><ul>${o.upd.map(x=>`<li>${x}</li>`).join('')}</ul><h5>Does not see</h5><ul>${o.no.map(x=>`<li>${x}</li>`).join('')}</ul>${o.b?`<div class="ba"><div class="b"><b>BEFORE</b>${o.b}</div><div class="n"><b>NOW</b>${o.n}</div></div>`:''}</div>`;
const FR=[];const frame=(id,x,y,w,t,s,inner)=>FR.push({id,x,y,w,html:`<header><b>${t}</b><span>${s||''}</span></header>${inner}`});
const JUMPS=[];const jump=(l,x,y,w,h)=>JUMPS.push({l,x,y,w,h});

/* ---------- header band ---------- */
frame('title',0,0,900,'Ravashing Build portal: screens board','concept, research phase',`<div class="pad"><h3 style="font-size:22px">What each person sees and taps</h3>
<p>Every screen below is a <b>mock-up</b>. Stands, names, counts and dates are <b>fictional</b>. Nothing is built. Everything here is <b>ASSUMED</b> (our proposal) until the people who do the work confirm it.</p>
<p><b>One rule:</b> work information (status, photos, doubts, changes, files, dates) travels only through the portal. WhatsApp is no longer a work channel. <span class="sm">(ASSUMED decision, for Narendra to confirm with the COO. Needs a plan for phone-less or offline moments; see the Photos board.)</span></p>
<p><b>How to read the board:</b> left to right follows a stand: Agency (Design, rep, Procurement, Coordination) → PM bridge → trade departments. Each line between two screens carries a tag: <span class="p bl">BEFORE</span> how it happened, <span class="p ok">NOW</span> how it is digitised. Screens for heads are desktop or tablet; screens for staff are phones with large buttons.</p>
<p class="sm">Prices never appear on any Build screen (ASSUMED). Access is enforced by the server, not only by hiding buttons.</p></div>`);
frame('legend',960,0,640,'Legend','',`<div class="pad"><p>${ok('Done')} ${wk('Working')} ${bl('Blocked / late')} ${ns('Not started')} ${nw('NEW: tap Seen')}</p>
<p><span class="btn">Done</span> <span class="btn w">Blocked</span> <span class="btn g">📷 Photo</span> <span class="btn r">? Doubt</span> <span class="sm">staff buttons: one tap, time and name added automatically</span></p>
<p><b>Desktop screen</b> = head of department, PM, top managers, Agency touchpoints. <b>Phone screen</b> = staff on the floor or on site.</p>
<p><b>Bell</b> = alerts. A NEW item stays red on the PM board until each department taps Seen.</p>
<p class="sm">Fictional codes: stands RV-26-014, -017, -021, -022. Shows A to D. Real names are kept out on purpose.</p></div>`);
frame('wa',1660,0,2040,'WhatsApp, calls and paper → portal','what moves where (ASSUMED)',`<div class="pad">${tbl(['Today (told or observed)','Becomes in the portal','Who gains'],[
['PMs track site steps in WhatsApp (confirmed)','One tap per step with time and name; the board builds itself','PM, Top managers, rep'],
['Photos sent to WhatsApp','Photo button on the task; tied to stand and step','PM, Design, rep'],
['Doubts by phone call; one went straight to Design and caused a mistake','Doubt card with a mark on the drawing and a photo; answer on the same card, visible to all on the stand','Trades, Design'],
['Design files forwarded as a zip by chat','One stand file; new version replaces old; NEW tap Seen','Every trade'],
['Changes reach some departments only','Change record names every department that must see it; red until seen','PM, Design'],
['"Where is the truck?" calls; paper load list','Crate and truck scans; status on the board','PM, Transport'],
['PM to boss and Sales updates by message or Excel','Top board and Sales status page built from taps','Top managers, rep'],
['Handover sheet and lessons on paper or not done','Walk checklist, snags, three-tap lessons at close','PM, Design']])}</div>`);
jump('Overview',0,0,3700,520);

/* ---------- access ---------- */
const M=[['Top managers','R - - - - - R R - - -'],['Head of PM','W R R R R R R R R R R'],['Project manager','R R R R R R W W R R R'],['Production Coord. (role unknown)','R R - R - R W W R R W'],['Dept head (trade)','R r r r W r W W W - W'],['Dept staff','r r r r W r W W W - -'],['Transport','r - - r - r W W W r W'],['Design','R W W W W W R R - - -'],['Sales rep','W R R - - W R R - - -'],['Procurement','R R - W - R - - R - -'],['Coordination','R - - - - - - - - W -'],['Outside AV / lighting','- - - - - - r r - - -']];
const cell=c=>c=='W'?'<td class="W">edit</td>':c=='R'?'<td class="Rr">see</td>':c=='r'?'<td class="r1">own part</td>':'<td class="Z">·</td>';
frame('access',0,620,2300,'Who has access to what','every cell ASSUMED; one owner per fact',`<div class="pad"><table class="mx"><tr><th>Role</th>${['Stand file','Design set','Colour spec','Item list','Doubts','Changes','Task status','Photos','Load list','Dates, passes','Head count'].map(x=>`<th>${x}</th>`).join('')}</tr>${M.map(r=>`<tr><td><b>${r[0]}</b></td>${r[1].split(' ').map(cell).join('')}</tr>`).join('')}</table>
<p class="sm"><span class="p ok">edit</span> creates or changes it · <span class="p nw">see</span> reads it · <span class="p wk">own part</span> sees only the part for their department or stand · dot = no access. Trades do not edit the Design set: they raise a doubt. Seeing a change means tapping Seen.</p></div>`);
frame('noaccess',2360,620,1340,'Who does not need access','keep it small, keep it safe',`<div class="info"><h5>Never on a Build screen</h5><ul><li>Prices, quotes, invoices, margins (Agency and Finance only)</li><li>Other departments' staff pay or HR records</li><li>Client contact details (the PM and rep keep them)</li></ul>
<h5>Only their own part</h5><ul><li>Staff see only stands and parts assigned to their department</li><li>Outside AV or lighting companies see only their own stand and their own electric tasks</li><li>Drivers and loaders see load lists and truck jobs only</li></ul>
<h5>No access at all</h5><ul><li>Marketing, HR, Mess (not Build work)</li><li>Finance on the floor screens (Finance reads its own Agency side)</li></ul>
<h5>Can read but never edit</h5><ul><li>Top managers: everything on the board, nothing editable</li><li>Trades: the Design set, only through doubts</li></ul></div>`);
jump('Access',0,620,3700,560);

/* ---------- Agency ---------- */
const aN=['Today','Design sets','Doubts','Changes','Lessons'];
frame('a-design',0,1300,560,'Agency · Design','Prateek side (touchpoint only)',desk({w:560,role:'Design',nav:aN,act:'Design sets',bell:3,title:'RV-26-014 · upload design set',body:`<div class="box"><b>Version 4</b> uploaded 14:20 → replaces v3<br>Includes 3D, 2D, item list, colour spec, artwork zip</div><br><b>Will be told (NEW):</b><br>${nw('Carpentry')} ${nw('Water Paint')} ${nw('Spray')} ${nw('Electric')} ${nw('Branding')}<br><br><span class="btn">Publish changes</span> <span class="btn g">Reason for change</span><br><br><b>Doubts waiting:</b> ${bl('1')} Ceiling frame, photo attached`}));
frame('a-rep',0,1840,560,'Agency · Sales rep','touchpoint only',desk({w:560,role:'Sales rep',nav:['Today','My stands','Client changes','Sign-off'],act:'My stands',title:'RV-26-017 · go-ahead',body:`<div class="box">Client confirmed show C 10:05. Pack checks: technicals ${ok('✓')} colours ${ok('✓')} proofs ${wk('1 open')}</div><br><span class="btn">Give go-ahead</span> <span class="btn g">Client change order</span><br><br><b>What the client asked for</b><br>Raise the counter 10 cm → creates a change record, sent to every department that must see it.`}));
frame('a-proc',0,2380,560,'Agency · Procurement and Estimation','touchpoint only',desk({w:560,role:'Procurement',nav:['Today','Item lists','Stock','Furniture','Returns'],act:'Item lists',title:'RV-26-014 · item list',body:tbl(['Item','Qty','Stock','Status'],[['LED strip','12 m','in stock',ok('ok')],['Plywood 18mm','18','to buy',wk('ordered')],['Chairs','6','reuse',ok('ok')],['Acrylic sign','1','to make',ns('Branding')]])+`<p class="sm">Procurement edits only the Stock and Status columns. Design owns the rest.</p>`}));
frame('a-coord',0,2920,560,'Agency · Project Coordination','touchpoint only',desk({w:560,role:'Coordination',nav:['Today','Shows','Passes','Approvals'],act:'Passes',title:'Show C · dates and passes',body:tbl(['Item','Date','Status'],[['Build-up window','Sun 06:00',ok('given')],['Loading bay slot','Sun 07:30',wk('asked')],['Vehicle pass','Sat',ok('issued')],['Organiser approval','Fri',bl('missing')]])+`<p class="sm">Entered once here. The PM passes the slot to Transport with one tap.</p>`}));
jump('Agency screens',0,1300,560,2100);

/* ---------- PM bridge ---------- */
frame('top',1000,1300,640,'Top managers','read only · built from taps',desk({role:'Top managers',nav:['Board','Shows','Risky stands','Load'],act:'Board',bell:2,title:'All stands this week',kpis:[['Stands live','14'],['On track','10'],['At risk','3'],['Blocked','1']],body:`<div class="two"><div class="box"><b>By colour</b><br>${ok('RV-26-014')} ${wk('RV-26-017')} ${bl('RV-26-021')} ${ok('RV-26-022')}</div><div class="box"><b>Next shows</b><br>Show C Sun · Show D 12 Dec<br><b>Risky</b>: 3 changes + 2 doubts</div></div><p class="sm">Nobody writes a report. Read only; no edit buttons.</p>`}));
frame('headpm',1000,2060,640,'Head of PM (Aman role)','all stands and all PMs',desk({role:'Head PM',nav:['Load','All stands','Allocate','Not seen','Alarms'],act:'Load',bell:4,title:'Load by PM this week',kpis:[['PMs','4'],['Stands','14'],['Late alarms','2']],body:tbl(['PM','Stands','Load','Not seen','Late'],[['PM 1','4','████░',bl('2'),'—'],['PM 2','3','███░░','—','—'],['PM 3','4','█████',wk('1'),bl('1')],['PM 4','3','██░░░','—','—']])+`<p class="sm">Allocate a stand = pick a PM. Load, not-seen and late are built from taps.</p>`}));
frame('pmboard',1000,2820,640,'Project manager: my stands','release · board',desk({role:'PM',nav:['My stands','Release','Doubts','Site steps','Snags','Lessons'],act:'My stands',bell:5,title:'RV-26-014 · handover pack and release',body:`<div class="two"><div class="box"><b>Pack check</b><br>Design set v4 ${ok('✓')}<br>Colours ${ok('✓')}<br>Proofs ${wk('1')}<br>Purchase list ${ok('✓')}<br>Rep go-ahead ${ok('✓')}<br><br><span class="btn">Release to Build</span></div><div class="box"><b>Who has Seen</b><br>Carpentry ${ok('✓')}<br>Water Paint ${ok('✓')}<br>Spray ${bl('not yet')}<br>Electric ${ok('✓')}<br>Branding ${wk('read')}<br>Transport ${ns('later')}</div></div><p class="sm">Last photo, open doubts and late alarm show on the stand card.</p>`}));
frame('pmphone',1000,3560,640,'Project manager: on site (phone)','also used by the other PMs',`<div class="two">${phone({title:'RV-26-014 · site steps',sub:'Show C · build-up',cards:[{t:'Truck',s:'reached 06:40, offloaded 07:20',b:[['✓ Done']]},{t:'Platform · Electric · Structure',s:'platform done 09:10',b:[['Done'],['📷 Photo','g'],['Blocked','w']]},{t:'Putty · Paint · Fitting · Logo',s:'next',b:[['Start']]}],tabs:['Steps','Snags','Doubts','Photos']})}<div class="info"><h5>Sees</h5><ul><li>Steps and photos from trades</li><li>Drawing (latest only)</li><li>Doubts on this stand</li></ul><h5>Updates</h5><ul><li>Site steps, snags, sign-off, lessons</li></ul><h5>Does not see</h5><ul><li>Prices; other PMs' stands (unless head PM)</li></ul></div></div>`);
jump('PM and top managers',1000,1300,640,3300);

/* ---------- trades ---------- */
const D=[

function draw(){const L=$('#lines');let s='';document.querySelectorAll('.lab').forEach(e=>e.remove());
 const R=id=>{const e=document.getElementById(id);return{x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight}};
 const A=(r,sd,k)=>sd=='r'?[r.x+r.w,r.y+r.h*k,1,0]:sd=='l'?[r.x,r.y+r.h*k,-1,0]:sd=='t'?[r.x+r.w*k,r.y,0,-1]:[r.x+r.w*k,r.y+r.h,0,1];
 C.forEach((c,i)=>{const a=A(R(c[0]),c[1],c[4]),b=A(R(c[2]),c[3],c[5]),d=Math.max(80,Math.hypot(b[0]-a[0],b[1]-a[1])*.4);
  const p=[a[0],a[1],a[0]+a[2]*d,a[1]+a[3]*d,b[0]+b[2]*d,b[1]+b[3]*d,b[0],b[1]];
  s+=`<path d="M${p[0]} ${p[1]}C${p[2]} ${p[3]} ${p[4]} ${p[5]} ${p[6]} ${p[7]}" fill="none" stroke="#2dd4bf" stroke-width="4" opacity=".85"/><circle cx="${b[0]}" cy="${b[1]}" r="7" fill="#2dd4bf"/>`;
  const m=t=>{const u=1-t;return[u*u*u*p[0]+3*u*u*t*p[2]+3*u*t*t*p[4]+t*t*t*p[6],u*u*u*p[1]+3*u*u*t*p[3]+3*u*t*t*p[5]+t*t*t*p[7]]},q=m(c[8]||.5);
  const l=document.createElement('div');l.className='lab';l.style.left=q[0]+'px';l.style.top=q[1]+'px';l.innerHTML=`<div class="b"><b>BEFORE</b>${c[6]}</div><div class="n"><b>NOW</b>${c[7]}</div>`;W.appendChild(l)});
 L.innerHTML=s}
FR.forEach(f=>{const e=document.createElement('section');e.className='fr';e.id=f.id;e.style.cssText=`left:${f.x}px;top:${f.y}px;width:${f.w}px`;e.innerHTML=f.html;W.appendChild(e)});

/* ---------- pan, zoom, jump ---------- */
let sc=.3,tx=250,ty=40;const vp=$('#vp'),ap=()=>W.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
const zoomAt=(f,cx,cy)=>{const n=Math.min(2.5,Math.max(.08,sc*f));tx=cx-(cx-tx)*n/sc;ty=cy-(cy-ty)*n/sc;sc=n;ap()};
vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
let dr=null;vp.addEventListener('pointerdown',e=>{dr=[e.clientX-tx,e.clientY-ty];vp.classList.add('d');vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(dr){tx=e.clientX-dr[0];ty=e.clientY-dr[1];ap()}});vp.addEventListener('pointerup',()=>{dr=null;vp.classList.remove('d')});
const go=(x,y,w,h)=>{const vw=innerWidth-210,vh=innerHeight;sc=Math.min(2,Math.min(vw/(w+80),vh/(h+80)));tx=200+(vw-w*sc)/2-x*sc;ty=(vh-h*sc)/2-y*sc;ap()};
JUMPS.forEach(j=>{const b=document.createElement('button');b.textContent=j.l;b.onclick=()=>go(j.x,j.y,j.w,j.h);$('#jumps').appendChild(b)});
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>zoomAt(+b.dataset.z,innerWidth/2,innerHeight/2));
