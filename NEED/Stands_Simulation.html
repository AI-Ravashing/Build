const ACT2P={mkt:'mkt',sales:'sales',design:'design',est:'est',fin:'fin',coord:'coord',hr:'hr',pm:'pm',prodco:'prodco',carp:'carp',water:'water',spray:'spray',elec:'elec',brand:'brand',trans:'trans'},TOPN={tariq:'Tariq',prateek:'Prateek',raveena:'Raveena Devnani'};

const roleOfAct=a=>TOPN[a]?'top':({mkt:'mkt',sales:'rep',design:'designer',est:'estproc',fin:'fin',coord:'coord',hr:'hr',pm:'pm',prodco:'prodco',carp:'foreman',water:'trade',spray:'foreman',elec:'foreman',brand:'foreman',trans:'foreman'})[a];
let fl={ph:null,act:null,arm:'people',grp:null,per:null};
const uniqEv=arr=>{const m=new Map();arr.forEach(x=>{const k=x.e.x.replace(/Stand [A-L]/g,'').slice(0,80);if(!m.has(k))m.set(k,{e:x.e,cp:x.cp,n:0,st:new Set(),tb:new Set()});const o=m.get(k);o.n++;o.st.add(x.s.id);x.e.tb.split(/,\s*|\s\+\s/).forEach(t=>o.tb.add(t))});return[...m.values()]};
function armData(a){const all=S.flatMap(s=>s.E.map(e=>({s,e}))),my=all.filter(x=>x.e.a==a).map(x=>({...x,cp:x.e.o}));
 const toMe=all.filter(x=>x.e.o==a).map(x=>({...x,cp:x.e.a}));
 return {made:uniqEv(my.filter(x=>x.e.t=='made')),managed:uniqEv(my.filter(x=>x.e.t=='managed')),
  got:uniqEv(my.filter(x=>x.e.t=='got').concat(toMe.filter(x=>x.e.t!='got'))),
  sent:uniqEv(my.filter(x=>x.e.t=='sent'||((x.e.t=='made'||x.e.t=='managed')&&x.e.o)).concat(toMe.filter(x=>x.e.t=='got'))),
  tables:[...new Set(my.flatMap(x=>x.e.tb.split(/,\s*|\s\+\s/)))].filter(Boolean)}}
const trunc=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t;
function flowTop(){const rows=PH.map((x,i)=>{const acts={};S.forEach(s=>s.E.filter(e=>e.ph==i).forEach(e=>{acts[e.a]=(acts[e.a]||0)+1}));const z=Z=>Object.keys(acts).filter(a=>A[a][1]==Z).map(a=>`<span class="d ${Z}" data-a="${a}">${A[a][0]} <small>${acts[a]}</small></span>`).join('');const here=S.filter(s=>cur(s)==i);
 return `<tr><td data-ph="${i}" style="cursor:pointer"><b>${i} · ${x}</b><div class="cp">${here.length?'now: '+here.map(s=>s.id).join(' '):'↓'}</div></td><td>${z('A')}</td><td>${z('B')}</td><td>${z('C')}</td><td>${z('X')}</td></tr>`}).join('');
 let ph='';if(fl.ph!=null){const i=fl.ph,by={};S.forEach(s=>s.E.filter(e=>e.ph==i).forEach(e=>{(by[e.a]=by[e.a]||[]).push({s,e})}));
  ph=`<div class="card" style="margin:14px 0"><b>Phase ${i} · ${PH[i]}</b> <span class="cp">who is involved, what they do, and what data moves (click a department to open it)</span>${tbl(['Department or party','People named','Does','Data'],Object.keys(by).map(a=>{const u=uniqEv(by[a].map(x=>({...x,cp:x.e.o}))).slice(0,4),ppl=[...new Set(by[a].map(x=>x.e.w).filter(Boolean))].slice(0,4).join(', ');return[`<span class="d ${A[a][1]}" data-a="${a}" style="cursor:pointer">${A[a][0]}</span>`,ppl||'—',u.map(o=>`<span class="v ${o.e.t}">${VERB[o.e.t]}</span> ${o.e.x}${o.cp?` <span class="cp">${o.e.t=='got'?'from':'to'} ${A[o.cp][0]}</span>`:''}`).join('<br>'),[...new Set(u.flatMap(o=>[...o.tb]))].slice(0,5).map(tg).join(' ')]}))}</div>`}
 return `<p class="sub">Start here: the life of a stand from lead to close, with everyone who touches each phase. The number is how many steps of the twelve stands they carry. Click a phase for its detail, or a department to open its snowflake.</p>${ph}<table class="fl"><tr><th>Phase</th><th>Agency</th><th>Top managers and bridge</th><th>Build</th><th>Outside</th></tr>${rows}</table>`}
function flowDept(){const a=fl.act,d=armData(a),pp=peopleOf(a),role=roleOfAct(a),mods=role?MODS.filter(m=>view(role)[m[0]]):[];
 const groups={};pp.forEach(p=>{(groups[p[1]]=groups[p[1]]||[]).push(p)});const gk=Object.keys(groups);
 const arms=[['people','People',pp.length],['made','Creates',d.made.length],['managed','Manages',d.managed.length],['got','Receives',d.got.length],['sent','Sends',d.sent.length],['tables','Data (tables)',d.tables.length],['screens','Screens',mods.length]];
 const COL={people:'#2f5fc4',made:'#127a5a',managed:'#b46a00',got:'#1d4ed8',sent:'#8a1fa0',tables:'#b3261e',screens:'#0f766e'};
 const cx=550,cy=300,r=165,W=1100,H=600;let svg=`<circle cx="${cx}" cy="${cy}" r="62" fill="#12343b"/><text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">${trunc(A[a][0],18)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" fill="#cfe0e3" font-size="11">${A[a][2]?trunc(A[a][2],22):'outside party'}</text>`;
 const pos={};arms.forEach((m,i)=>{const th=(-90+i*360/arms.length)*Math.PI/180;pos[m[0]]=[cx+r*Math.cos(th),cy+r*Math.sin(th),Math.cos(th)]});
 let L0='';arms.forEach(m=>{const[x,y]=pos[m[0]];L0+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${COL[m[0]]}" stroke-width="3" opacity=".5"/>`});
 const leaves=fl.arm=='people'?gk.map(t=>({t:`${t} (${groups[t].length})`,g:t})):fl.arm=='tables'?d.tables.map(t=>({t})):fl.arm=='screens'?mods.map(m=>({t:m[1]})):(d[fl.arm]||[]).map(o=>({t:o.e.x}));
 const sel=pos[fl.arm],right=sel[2]>-0.2,n=Math.min(leaves.length,12),lx=right?cx+300:cx-300-190,top=Math.max(14,Math.min(H-14-n*36,sel[1]-n*18));
 leaves.slice(0,12).forEach((l,i)=>{const y=top+i*36,ex=right?lx:lx+190;svg+=`<path d="M${sel[0]} ${sel[1]}C${(sel[0]+ex)/2} ${sel[1]} ${(sel[0]+ex)/2} ${y+15} ${ex} ${y+15}" fill="none" stroke="${COL[fl.arm]}" opacity=".45" stroke-width="1.8"/><g class="leaf" data-g="${l.g||''}" data-i="${i}"><rect x="${lx}" y="${y}" width="190" height="30" rx="8"/><text x="${lx+8}" y="${y+19}" font-size="12" fill="#1c2330">${trunc(l.t.replace(/&/g,'and'),30)}</text></g>`});
 if(leaves.length>12)svg+=`<text x="${lx}" y="${top+12*36+14}" font-size="12" fill="#667180">+ ${leaves.length-12} more, see the list below</text>`;
 arms.forEach(m=>{const[x,y]=pos[m[0]];svg+=`<g class="arm ${m[0]==fl.arm?'on':''}" data-arm="${m[0]}"><rect x="${x-62}" y="${y-20}" width="124" height="40" rx="12" fill="${COL[m[0]]}"/><text x="${x}" y="${y-2}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${m[1]}</text><text x="${x}" y="${y+13}" text-anchor="middle" fill="#fff" font-size="11" opacity=".85">${m[2]}</text></g>`});
 let detail='';
 if(fl.arm=='people'){const g=fl.grp&&groups[fl.grp]?[fl.grp]:gk;detail=pp.length?g.map(t=>`<h3>${t} <span class="cp">${groups[t].length}</span></h3><div class="pchips">${groups[t].map(p=>`<span data-p="${p[0]}">${p[0]}</span>`).join('')}</div>`).join(''):'<p class="cp">An outside party: no one of ours.</p>'}
 else if(fl.arm=='tables')detail=`<div class="pchips">${d.tables.map(t=>`<b style="font-weight:400;background:#fff;padding:3px 10px;border-radius:12px;border:1px solid var(--line)">${tg(t.match(/^(SS|BS|GAP) /)?t:'BS '+t)}</b>`).join('')}</div>`;
 else if(fl.arm=='screens')detail=role?tbl(['Tab','Access','Table'],mods.map(m=>[m[1],view(role)[m[0]]=='W'?'<span class="wr">can edit</span>':'<span class="rd">read only</span>',tg(m[3])])):'<p class="cp">No portal screens (outside party).</p>';
 else detail=tbl(['Step (across the 12 stands)','With','Stands','Data'],d[fl.arm].map(o=>[`<span class="v ${o.e.t}">${VERB[o.e.t]}</span> ${o.e.x}`,o.cp?A[o.cp][0]+(o.e.ow?' ('+o.e.ow+')':''):'—',[...o.st].join(' '),[...o.tb].slice(0,3).map(tg).join(' ')]));
 return `<p class="sub">${A[a][0]} at the centre. Each arm is something it has: people, what it creates, manages, receives and sends, the tables the data lives in, and its screens. Click an arm to open its leaves; click a person to see their portal.</p><svg class="fz" viewBox="0 0 ${W} ${H}">${L0}${svg}</svg><h3>${arms.find(m=>m[0]==fl.arm)[1]}</h3>${detail}`}
function flowPerson(){const p=fl.per,a=fl.act,role=p[2],v=view(role),mods=MODS.filter(m=>v[m[0]]),f=p[0].split(' ')[0],mine=S.flatMap(s=>s.E.filter(e=>(e.w||'').split(/[ ,]/).includes(f)||(e.ow||'').split(/[ ,]/).includes(f)).map(e=>({s,e}))).filter(x=>dkey(x.e.d)>=dkey(asOf)-3&&dkey(x.e.d)<=dkey(asOf)+3).slice(0,14);
 return `<div class="card"><b style="font-size:19px">${p[0]}</b> · ${p[1]}<div class="cp">${A[a][0]} · portal role: ${ROLES[role][0]} · ${ROLES[role][1]=='phone'?'phone':'desktop or tablet'} · ${chain(a)||''}</div><p><span class="btn" id="goscr">Open this person's portal</span></p></div>
 <div class="row" style="margin-top:14px"><div class="card show"><b>Tabs this person sees (${mods.length} of ${MODS.length})</b><div class="pchips" style="margin-top:8px">${mods.map(m=>`<span style="cursor:default">${m[1]}${v[m[0]]=='W'?' ✎':''}</span>`).join('')}</div><div class="cp" style="margin:10px 0 4px"><b>Hidden:</b></div><div class="hid">${MODS.filter(m=>!v[m[0]]).map(m=>`<span>${m[1]}</span>`).join('')}</div></div>
 <div class="card show"><b>Data they read and write</b>${tbl(['','Tab','Table'],mods.map(m=>[`<span class="${v[m[0]]=='W'?'wr':'rd'}">${v[m[0]]}</span>`,m[1],tg(m[3])]))}</div></div>
 <h3>Where this person appears in the stands (3 days either side of the date bar)</h3>${mine.length?tbl(['Date','Stand','Step','With'],mine.map(({s,e})=>[fm(e.d),sg(s),`<span class="v ${e.t}">${VERB[e.t]}</span> ${e.x}`,e.o?A[e.o][0]:'—'])):`<p class="cp">No named steps for ${p[0]} on these dates. For ordinary team members the work arrives as taps on the ${A[a][0]} team's tasks, so the steps are recorded under the head.</p>`}`}
function vFlow(){const el=$('#v-flow');let body;
 if(fl.per)body=flowPerson();else if(fl.act)body=flowDept();else body=flowTop();
 el.innerHTML=`<h2>Flow map: flow, department, person</h2><div class="crumb cp" style="margin-bottom:10px"><a href="#" data-b="0">Flow</a>${fl.act?` › <a href="#" data-b="1">${A[fl.act][0]}</a>`:''}${fl.per?` › <b>${fl.per[0]}</b>`:''}</div>${body}`;
 el.querySelectorAll('[data-b]').forEach(c=>c.onclick=e=>{e.preventDefault();if(c.dataset.b=='0'){fl.act=null;fl.per=null;fl.ph=null}else fl.per=null;vFlow()});
 el.querySelectorAll('[data-a]').forEach(c=>c.onclick=()=>{fl.act=c.dataset.a;fl.arm='people';fl.grp=null;fl.per=null;vFlow();scrollTo(0,0)});
 el.querySelectorAll('[data-ph]').forEach(c=>c.onclick=()=>{fl.ph=fl.ph==+c.dataset.ph?null:+c.dataset.ph;vFlow()});
 el.querySelectorAll('[data-arm]').forEach(c=>c.onclick=()=>{fl.arm=c.dataset.arm;fl.grp=null;vFlow()});
 el.querySelectorAll('.leaf[data-g]').forEach(c=>c.onclick=()=>{if(c.dataset.g){fl.grp=c.dataset.g;vFlow()}});
 el.querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{fl.per=peopleOf(fl.act).find(p=>p[0]==c.dataset.p);vFlow();scrollTo(0,0)});
 const g=$('#goscr');if(g)g.onclick=()=>{const d=Object.keys(PEOPLE).find(k=>PEOPLE[k].includes(fl.per));sdept=d;sperson=fl.per[0];smod=null;vScreens();showTab('screens')}}
function render(){bar();s_blocked();vOver();vFlow();vJourney();vDept();vAlerts();vTop();vAlloc();vScreens();vData();vHier();vNotes()}render();
</script></body></html>
