<h3>2. Crew needed against crew available (Web Show stands)</h3><table><tr><th>Department</th><th>People</th>${days.map(d=>`<th>${d} Nov<br><span class="cp" style="font-weight:400">${d<9?'Build area':d==9?'Site: offload':'Site'}</span></th>`).join('')}</tr>${Object.keys(CAP).map(k=>`<tr><td><b>${DM[k][0]}</b></td><td>${CAP[k]}</td>${days.map(d=>{const t=tot(d,k),o=t>CAP[k];return `<td><div class="bar ${o?'over':''}"><i style="width:${Math.min(100,t/CAP[k]*100)}%"></i></div>${t} of ${CAP[k]} ${o?'<span class="p bl">over</span>':''}</td>`}).join('')}</tr>`).join('')}</table><div class="note">The sheet shows days where more people are needed than the department has. Today this is found by phone calls. The fix is a decision for the Head of PM: move a stand, bring in outside labour, or add hours. Outside labour is not counted here.</div>
<h3>3. Machines and areas (Resource and Booking)</h3><table><tr><th>Machine or area</th><th>Booked</th><th>Stand</th><th>Note</th></tr><tr><td>CNC router</td><td>7 Nov, 09:00 to 13:00</td><td>103 Bluepeak Cloud</td><td>Signage</td></tr><tr><td>Acrylic bench</td><td>7 to 8 Nov</td><td>101 and 105</td><td>Logo and acrylic wall</td></tr><tr><td>Spray booth (3 people)</td><td>7 Nov</td><td>102 Northwind Software</td><td>—</td></tr><tr><td>Spray booth</td><td>8 Nov</td><td>106 Lumen Games</td><td><span class="p bl">106 was released late, booth is tight</span></td></tr></table>
<h3>4. Trucks (TruckTrip, TripStand)</h3><table><tr><th>Trip</th><th>Date</th><th>Stands</th><th>Check</th></tr><tr><td>T-41</td><td>8 Nov</td><td>101, 104, 107</td><td><span class="p ok">all packed or packing</span></td></tr><tr><td>T-42</td><td>9 Nov, early</td><td>102, 105</td><td><span class="p bl">105 blocked: colour spec</span></td></tr><tr><td>T-43</td><td>9 Nov</td><td>103, 106</td><td><span class="p bl">106 still in Release; a change on 103 is not fully seen</span></td></tr><tr><td>T-51</td><td>12 Dec</td><td>108 to 112</td><td><span class="p ns">too early to book</span></td></tr></table>`}
/* ---------- data rows ---------- */
function vData(){const s=cs(),tr=trades(s),rel=s.cur>=5,T=(t,h,r)=>`<h3>${tg(t)}</h3><div class="dt"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
 const pk=['TECHNICALS','COLOUR_SPEC','PRINT_PROOF','FINISH_SPEC','APPROVALS','PURCHASING_LIST'];
 $('#v-data').innerHTML=`<h2>The rows behind one stand: ${s.code}</h2><p class="sub">What the tables would hold for this stand today. SS tables belong to Prateek's schema; BS tables are ours (proposed). Fictional.</p>${chips()}`+
 T('SS Project',['code','outcome','technicalStatus','designerId'],[[s.code,s.cur>=4?'CONFIRMED':'PENDING',s.cur>=4?'APPROVED':s.cur>=3?'CHECKING':'DRAFTING',s.des]])+
 (rel?T('BS BuildStand',['projectId','source','buildStatus','pm','goAheadAt','releasedAt'],[[s.code,'MANUAL (first slice)',ST[s.cur].toUpperCase(),s.pm,fm(addD(SHOW[s.sh].d,-15)),fm(s.E.find(e=>e.st==5&&e.d=='pm'&&e.t=='made').dt)]])
 +T('BS StandDepartment',['standId','department','reason','neededFrom','seen'],tr.map(d=>[s.code.slice(-3),DM[d][0],'ELEMENT_RULE',fm(addD(SHOW[s.sh].d,-12)),s.fresh?'<span class="p wk">not yet</span>':'<span class="p ok">yes</span>']))
 +T('BS HandoverCheck',['standId','kind','state'],pk.map(k=>[s.code.slice(-3),k,(s.blocked&&k=='COLOUR_SPEC')?'<span class="p bl">MISSING</span>':'<span class="p ok">PRESENT</span>'])):'<div class="note">Not released yet, so Build has no rows for this stand. Only Prateek\'s side holds it.</div>')+
 (s.change?T('BS ChangeNotice and ChangeSeen',['kind','summary','must see','seen'],[['DESIGN_REVISION','Counter height 2.4 to 2.7 m',tr.length+' departments',`<span class="p wk">${Math.ceil(tr.length/2)} of ${tr.length}</span>`]]):'')+
 (s.doubt?T('BS Doubt',['standId','department','mark','photo','status'],[[s.code.slice(-3),'Carpentry','x 0.62, y 0.31','1 photo','<span class="p wk">OPEN</span>']]):'')+
 (s.cur>=6?T('BS BuildTask',['standId','department','part','status'],tr.map((d,i)=>[s.code.slice(-3),DM[d][0],['Structure','Paint','Spray finish','Lighting','Panels'][['carp','water','spray','elec','brand'].indexOf(d)],s.cur>6?'<span class="p ok">DONE</span>':(s.blocked&&s.blocked[0]==d)?'<span class="p bl">BLOCKED</span>':i%2?'<span class="p wk">WORKING</span>':'<span class="p ok">DONE</span>'])):'')+
 (s.cur>=7?T('BS Crate and TruckTrip',['crate','contents','packedBy','trip'],[['CR-26-0'+s.code.slice(-2)+'1','Structure panels',tr[0]?DM[tr[0]][0]:'Branding',s.code=='RV-26-101'||s.code=='RV-26-104'||s.code=='RV-26-107'?'T-41':'T-42'],['CR-26-0'+s.code.slice(-2)+'2','Lights and cables','Electric','same trip']]):'');
 bindChips()}
function vNotes(){$('#v-notes').innerHTML=`<h2>Notes and gaps</h2><div class="row"><div class="card show"><b>What is fictional</b><p>Exhibitor names, sizes, dates inside each stage, crew numbers, machine bookings and trucks. The two shows and their opening dates are as Narendra gave them.</p></div><div class="card show"><b>What comes from research</b><p>Departments and head counts (HR chart, 6 Nov), flows between them (told by Ali, Prateek, Akhil), table names (Prateek's 7th update and our proposed Build schema).</p></div><div class="card show"><b>Gaps this exposes</b><ul><li>Nothing in either schema holds passes and approvals (Q104).</li><li>The rep's go-ahead has no field yet (Q105).</li><li>Marketing, Finance and Production Coordination barely appear because we do not know what they do (Q96, Q106, Q107).</li><li>Outside labour is not counted in the crew sheet.</li></ul></div></div><h3>Question for Narendra</h3><p>Split confirmed by Narendra, 7 Nov: 7 stands at the Web Show and 5 at GITEX, twelve in total.</p>`}
function render(){vScreens();vOver();vJourney();vDept();vAlloc();vData();vNotes()}render();
