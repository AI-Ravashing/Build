const tagTables=tb=>{const out=[];let sch='';(tb||'').replace(/\([^)]*\)/g,'').split(/,\s*|\s\+\s/).forEach(t=>{t=t.trim();const m=t.match(/^(SS|BS|GAP) (.*)$/);let name=t;if(m){sch=m[1];name=m[2]}if(!sch)return;name=name.replace(/\..*$/,'').replace(/ stage$/,'').trim();const k=sch+' '+name;if(TBL[k])out.push(k)});return out};
function tableView(key){const T=TBL[key],rows=S.flatMap(s=>s.E.filter(e=>dkey(e.d)<=dkey(asOf)&&tagTables(e.tb).includes(key)).map(e=>({s,e}))).sort((a,b)=>a.e.d-b.e.d);
 const fs=T.fields.map(f=>f[0]);let used={};
 const val=(f,r,i)=>{const{s,e}=r,n=f,k=n.toLowerCase();let v='';
  if(n=='id')v='#'+String(i+1).padStart(4,'0');
  else if(/^(standid|projectid|project)$/.test(k))v=s.code;
  else if(/^(company|companyid)$/.test(k))v=s.co;
  else if(/^(exhibition|exhibitionid)$/.test(k))v=SHOW[s.sh].n;
  else if(/(by|byid|userid)$/.test(k)&&!/seen/.test(k)){if(!used.by){used.by=1;v=e.w||A[e.a][0]}}
  else if(/(summary|text|note|description|message|body|title|label|reason|answer)$/.test(k)){if(!used.tx){used.tx=1;v=e.x}}
  else if(/(status|state|outcome|stage)$/.test(k))v={done:'done',today:'today',todo:'planned',blocked:'OPEN'}[stt(e)];
  else if(/(department|dept)$/.test(k))v=A[e.a][0];
  else if(/(at|date|on)$/.test(k)&&!/^(updated|deleted)/.test(k)){if(!used.dt){used.dt=1;v=fm(e.d)}}
  else if(k=='costtotal')v=s.cost+'k';else if(k=='markuppct')v=s.mk+'%';else if(k=='finalprice')v=Math.round(s.cost*(1+s.mk/100))+'k';
  return v};
 const cells=rows.slice(-14).map((r,i)=>{used={};return fs.map(f=>val(f,r,rows.length-Math.min(14,rows.length)+i))});
 let cols=fs.map((f,j)=>j).filter(j=>cells.some(c=>c[j]));if(cols.length<4)cols=fs.map((f,j)=>j).slice(0,6);
 const head=`<div class="card" style="margin:8px 0"><b>${tg(key)}</b> <span class="cp">${T.fields.length} fields · ${rows.length} row${rows.length==1?'':'s'} written up to ${fm(asOf)}</span><div class="cp">${T.why}</div></div>`;
 const grid=rows.length?`<div style="overflow:auto"><table><tr>${cols.map(j=>`<th>${fs[j]}</th>`).join('')}<th>written by</th></tr>${cells.map((c,i)=>`<tr>${cols.map(j=>`<td>${c[j]||'<span class="cp">·</span>'}</td>`).join('')}<td class="cp">${A[rows.slice(-14)[i].e.a][0]}</td></tr>`).join('')}</table></div>`:'<p class="cp">No rows yet on this date. Move the date bar.</p>';
 const note=`<p class="cp">The table above shows the columns our simulation fills, with one row for each step in the twelve stands that writes here. Blank dots mean the simulation does not make that value up. Showing the latest ${Math.min(14,rows.length)} of ${rows.length}.</p>`;
 const struct=`<h3>Structure: all ${T.fields.length} fields</h3><div style="overflow:auto"><table><tr><th>Field</th><th>Type</th><th>Rule</th><th>Meaning</th></tr>${T.fields.map(f=>`<tr><td><b>${f[0]}</b></td><td>${f[1]}</td><td>${f[2]}</td><td class="cp">${f[3]}</td></tr>`).join('')}</table></div>`;
 return head+grid+note+struct}
